<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1C2E5C" />
<meta name="description" content="LA HUNE — Draft Survey. Outil de pesée par tirants d'eau." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="LA HUNE Draft" />
<title>LA HUNE — Draft Survey</title>
<link rel="stylesheet" href="style.css" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
</head>
<body>

<div class="bandeau">
  <div class="bandeau-haut">
    <span class="marque">LA&nbsp;HUNE.</span>
    <span class="titre-app">Draft Survey</span>
    <span class="dossier-ref" id="ref-dossier"></span>
  </div>
  <nav class="onglets" id="onglets" aria-label="Sections de l'outil">
    <button data-vue="navire">Navire</button>
    <button data-vue="pesees">Pesées</button>
    <button data-vue="resultats">Résultats</button>
    <button data-vue="dossier">Dossier</button>
    <button data-vue="controle">Contrôle</button>
  </nav>
</div>

<main id="vue" tabindex="-1"></main>

<footer class="pied" id="pied"></footer>

<script src="engine.js"></script>
<script src="hydro-evership.js"></script>
<script src="bench.js"></script>
<script src="docx.js"></script>
<script src="app.js"></script>
<script>
// Enregistrement du service worker : rend l'outil disponible hors reseau.
// Volontairement en dernier, et sans bloquer : si l'enregistrement echoue
// (navigation privee, page servie en file://), l'application fonctionne
// quand meme, elle ne sera simplement pas disponible hors reseau.
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function (e) {
      console.warn("Mode hors reseau indisponible :", e && e.message ? e.message : e);
    });
  });
}
</script>
</body>
</html>
