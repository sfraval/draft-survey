# =============================================================================
# LA HUNE - Draft Survey : validation puis deploiement
# =============================================================================
# Cette chaine tourne sur les serveurs de GitHub. Rien a lancer sur ton Mac,
# aucun terminal, aucune commande a taper.
#
# Deux etapes qui s'enchainent :
#
#   1. validation  : execute le banc de test (moteur contre la pesee reelle de
#                    l'EVER SHIP) et l'audit d'architecture (aucune ressource
#                    distante, aucune compilation dans le navigateur).
#   2. deploiement : ne demarre QUE si l'etape 1 est verte. Un moteur qui
#                    calcule faux ne peut donc pas atteindre la production.
#
# Le rapport lisible s'affiche directement dans l'onglet Actions du depot,
# et le proces-verbal est conserve 90 jours en piece jointe de l'execution.
# =============================================================================

name: Validation et deploiement

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # bouton "Run workflow" dans l'onglet Actions, pour relancer a la demande
  workflow_dispatch:

# Droits minimaux necessaires au deploiement sur Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule execution a la fois : une nouvelle annule la precedente
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  validation:
    name: Validation du moteur
    runs-on: ubuntu-latest
    steps:
      - name: Recuperation du depot
        uses: actions/checkout@v4

      - name: Installation de Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
        # Pas de cache npm : l'outil n'a aucune dependance, c'est voulu.

      - name: Banc de test et audit d'architecture
        id: banc
        run: |
          node run-node.js --pv proces-verbal-validation.txt
        # Le lanceur renvoie 1 si un seul controle echoue, ce qui arrete
        # l'etape et donc tout le workflow.

      - name: Dependances de test
        run: npm install --no-audit --no-fund
        # jsdom uniquement, pour piloter l'interface dans un DOM. Ces paquets ne
        # sont JAMAIS deployes : l'application publiee n'a aucune dependance.
        # L'audit d'architecture verifie d'ailleurs qu'aucun fichier livre ne
        # charge quoi que ce soit depuis un serveur.

      - name: Test de bout en bout de l'interface
        run: node test-interface.js
        # Verifie le cablage entre l'interface et le moteur : un moteur juste
        # relie a un mauvais champ donne un resultat faux. Couvre le profil
        # navire, l'import de la table du bord, les six tirants d'eau, le
        # registre de tanks, le chainage et la production du rapport Word.

      - name: Rapport lisible dans l'onglet Actions
        if: always()
        run: |
          node run-node.js --md >> "$GITHUB_STEP_SUMMARY" || true
        # "always" et "|| true" : on veut le rapport meme quand ca echoue,
        # c'est precisement la qu'il sert.

      - name: Rapport machine
        if: always()
        run: |
          node run-node.js --json > rapport-validation.json || true

      - name: Conservation du proces-verbal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ github.run_number }}
          path: |
            proces-verbal-validation.txt
            rapport-validation.json
          retention-days: 90
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  deploiement:
    name: Deploiement sur Pages
    needs: validation          # <- le verrou : pas de validation, pas de mise en ligne
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Recuperation du depot
        uses: actions/checkout@v4

      - name: Configuration de Pages
        uses: actions/configure-pages@v5

      - name: Preparation du dossier a publier
        run: |
          mkdir -p site
          # Fichiers de l'application. Aucune etape de compilation : les
          # fichiers publies sont exactement ceux du depot.
          cp index.html site/
          cp validation.html site/
          cp engine.js bench.js hydro-evership.js docx.js app.js site/
          cp style.css site/
          cp manifest.webmanifest site/ 2>/dev/null || true
          cp sw.js site/ 2>/dev/null || true
          cp -r icons site/ 2>/dev/null || true
          # Empeche Jekyll de reinterpreter les fichiers
          touch site/.nojekyll
          ls -la site

      - name: Envoi de l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Mise en ligne
        id: pages
        uses: actions/deploy-pages@v4
